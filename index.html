<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<!-- FIX #1: dinagdagan yung viewport para hindi mag-zoom/gumalaw pag nag-tap o nag-scroll -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a7f5a">
<title>Cocktails Manila Inventory</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
<!-- FIX #2: mobile scroll stability — pinipigilan yung left-right wiggle at yung pag-bounce ng buong screen -->
<style>
  html, body {
    overflow-x: hidden;
    max-width: 100vw;
    overscroll-behavior-y: none;
  }
  body {
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
  }
</style>
</head>
<body>
<!-- CHANGED: splash screen — plain background shown while the app is loading;
     hidden by app.js once ready. Change background:#ffffff to #000000 for black. -->
<div id="splash" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#ffffff;z-index:9999"></div>
<script>
/* Failsafe: auto-hide the splash after 6 seconds no matter what,
   so the app can never get stuck on a blank screen */
setTimeout(function () {
  var s = document.getElementById('splash');
  if (s) s.style.display = 'none';
}, 6000);
</script>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand" onclick="go('events')" style="cursor:pointer">
      <img src="logo.png" alt="Cocktails Manila" class="brand-logo">
      <div>
        <div class="brand-title">Cocktails Manila Inventory</div>
      </div>
    </div>
    <button class="icon-btn" onclick="openMenu()" title="Menu">⋮</button>
  </div>
</header>
<main id="view"></main>
<nav class="bottomnav">
  <button data-tab="db" onclick="go('db')"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg></span>Database</button>
  <button data-tab="events" onclick="go('events')"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>Events</button>
  <button data-tab="toolbox" onclick="go('toolbox')"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span>Toolbox</button>
  <button data-tab="food" onclick="go('food')"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8z"/><path d="M9 4c0 1.5 1 1.5 1 3"/><path d="M14 4c0 1.5 1 1.5 1 3"/></svg></span>Food</button>
  <button data-tab="leads" onclick="go('leads')"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>Leads</button>
</nav>
<!-- generic modal -->
<div id="modalOverlay" class="modal-overlay hidden" onclick="overlayClick(event)">
  <div id="modal" class="modal"></div>
</div>
<!-- hidden inputs -->
<input type="file" id="photoInput" accept="image/*" class="hidden-input">
<input type="file" id="importInput" accept="application/json,.json" class="hidden-input">
<div id="toast" class="toast hidden"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAQ-a7gAcDJHqio3-umcu5TpN5UK_E9w2o",
    authDomain: "cocktails-manila-inventory.firebaseapp.com",
    projectId: "cocktails-manila-inventory",
    storageBucket: "cocktails-manila-inventory.firebasestorage.app",
    messagingSenderId: "767327100367",
    appId: "1:767327100367:web:e6932cf67d8350a93946ba"

<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
